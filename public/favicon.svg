<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- orbital ring, tilted -30° -->
  <ellipse cx="16" cy="16" rx="12.5" ry="5.5"
    stroke="#3b82f6" stroke-width="1.8" fill="none"
    transform="rotate(-30 16 16)"/>
  <!-- planet -->
  <circle cx="16" cy="16" r="4.5" fill="#3b82f6"/>
  <!-- satellite dot at the rightmost point of the rotated ellipse -->
  <circle cx="26.8" cy="9.75" r="2" fill="#93c5fd"/>
</svg>
