name: Release Action

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          NEW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAJOR="${NEW_TAG%%.*}"
          echo "Moving $MAJOR to point at $NEW_TAG ($GITHUB_SHA)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push origin "$MAJOR" --force
